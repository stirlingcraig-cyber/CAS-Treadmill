<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CAS Treadmill</title><meta name="description" content="Treadmill companion for CAS Trainer: Bluetooth FTMS link, virtual routes and interval workouts">
<meta name="theme-color" content="#167A49"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="CAS Treadmill"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/png" href="icon-512.png"><script>window.STORE_PREFIX = "trainer.";</script>
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#EDF1EF; --surface:#FFFFFF; --surface-2:#F4F7F5; --surface-3:#E6ECE9;
  --line:#D5DDD9; --line-strong:#B9C4BF;
  --ink:#131A18; --ink-2:#46534E; --ink-3:#74827C;
  --accent:#2C43E0; --accent-hover:#2336BD; --accent-ink:#FFFFFF; --accent-soft:#E1E6FF;
  --protein:#D0306A; --carbs:#D58E00; --fat:#0F8F83; --fibre:#5E8A1E;
  --good:#1B8E4E; --warn:#B86E00; --bad:#C8302A;
  --good-soft:#DDF3E6; --warn-soft:#FBEBCF; --bad-soft:#FADCDA;
  --work:#E0443F; --rest:#12907F; --prep:#D99A00; --done:#2C43E0;
  --shadow:0 1px 2px rgba(20,30,28,.06),0 8px 24px -12px rgba(20,30,28,.18);
  --radius:14px; --radius-sm:9px;
  --f-display:"Big Shoulders Display","Oswald","Arial Narrow",Impact,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0C1113; --surface:#141B1E; --surface-2:#192226; --surface-3:#212C31;
    --line:#26333A; --line-strong:#3A4A52;
    --ink:#E5EDEA; --ink-2:#A6B4AF; --ink-3:#71807B;
    --accent:#8394FF; --accent-hover:#9DAAFF; --accent-ink:#0C1113; --accent-soft:#1D2554;
    --protein:#E24A80; --carbs:#B98010; --fat:#1AA596; --fibre:#9CCB55;
    --good:#4FD28A; --warn:#FFB547; --bad:#FF6E66;
    --good-soft:#12301F; --warn-soft:#3A2A0C; --bad-soft:#3A1614;
    --work:#FF625C; --rest:#2FD0B9; --prep:#FFC23D; --done:#8394FF;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0C1113; --surface:#141B1E; --surface-2:#192226; --surface-3:#212C31;
  --line:#26333A; --line-strong:#3A4A52;
  --ink:#E5EDEA; --ink-2:#A6B4AF; --ink-3:#71807B;
  --accent:#8394FF; --accent-hover:#9DAAFF; --accent-ink:#0C1113; --accent-soft:#1D2554;
  --protein:#E24A80; --carbs:#B98010; --fat:#1AA596; --fibre:#9CCB55;
  --good:#4FD28A; --warn:#FFB547; --bad:#FF6E66;
  --good-soft:#12301F; --warn-soft:#3A2A0C; --bad-soft:#3A1614;
  --work:#FF625C; --rest:#2FD0B9; --prep:#FFC23D; --done:#8394FF;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7);
}
*,*::before,*::after{box-sizing:border-box}
html,body{background:var(--bg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100%}
button,input,select,textarea{font:inherit;color:inherit}
button,a,label,.chip,.tab{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
body::before{content:"";position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:45;pointer-events:none}
h1,h2,h3,h4{margin:0;text-wrap:balance;line-height:1.1}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:minmax(0,1fr);min-height:100%}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:34px;height:34px;flex:none}
.brand-name{font-family:var(--f-display);font-weight:900;font-size:24px;letter-spacing:.02em;text-transform:uppercase;line-height:1;white-space:nowrap}
.brand-name span{color:var(--accent)}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.sync{font-family:var(--f-mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--ink-3);display:inline-block}
@media (max-width:460px){.sync span{display:none}.brand-name{font-size:21px}}
.sync.ok i{background:var(--good)} .sync.busy i{background:var(--warn)} .sync.err i{background:var(--bad)}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.icon-btn:hover{border-color:var(--line-strong);color:var(--ink)}
.icon-btn svg{width:18px;height:18px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
.tab{appearance:none;border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:10px;color:var(--ink-3);font-size:11px;font-weight:600;letter-spacing:.01em;min-width:0}
.tab svg{width:22px;height:22px}
.tab[aria-selected="true"]{color:var(--accent)}
.tab[aria-selected="true"] svg{stroke-width:2.4}
.main{max-width:1180px;width:100%;margin:0 auto;padding-inline:16px;padding-block:18px 110px}
@media (min-width:960px){
  .app{grid-template-columns:220px minmax(0,1fr)}
  .topbar{grid-column:1/-1}
  .tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 60px);align-self:start;display:flex;flex-direction:column;gap:4px;border:0;background:none;padding:22px 12px;bottom:auto}
  .tab{flex-direction:row;gap:12px;font-size:15px;padding:11px 14px;justify-content:flex-start}
  .tab[aria-selected="true"]{background:var(--accent-soft)}
  .tab:hover{color:var(--ink)}
  .tab[aria-selected="true"]:hover{color:var(--accent)}
  .main{padding-block:26px 60px;padding-inline:8px 24px;margin:0}
}

/* ---------- common ---------- */
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.h1{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,6vw,48px);text-transform:uppercase;letter-spacing:.01em;line-height:.95}
.h2{font-family:var(--f-display);font-weight:800;font-size:24px;text-transform:uppercase;letter-spacing:.02em}
.h3{font-size:15px;font-weight:700}
.sub{color:var(--ink-2);font-size:14px}
.muted{color:var(--ink-3)}
.small{font-size:13px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.between{justify-content:space-between}
.spacer{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);min-width:0}
.card.flat{box-shadow:none}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.divider{height:1px;background:var(--line);margin:4px 0}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;background:var(--surface-3);color:var(--ink-2);white-space:nowrap}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.dot{width:9px;height:9px;border-radius:3px;display:inline-block;flex:none}
.note{border-radius:var(--radius-sm);padding:10px 12px;font-size:13.5px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}
.note.warn{background:var(--warn-soft);border-color:transparent;color:var(--ink)}
.note.bad{background:var(--bad-soft);border-color:transparent;color:var(--ink)}
.note.good{background:var(--good-soft);border-color:transparent;color:var(--ink)}
.note b{color:var(--ink)}

/* buttons */
.btn{appearance:none;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 15px;font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;min-height:40px;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-3);color:var(--ink)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn.sm{padding:5px 10px;min-height:32px;font-size:13px;border-radius:8px}
.btn.lg{padding:13px 22px;min-height:50px;font-size:16px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:17px;height:17px}

/* forms */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.lbl{font-size:12.5px;font-weight:600;color:var(--ink-2);letter-spacing:.01em}
.field .hint{font-size:12px;color:var(--ink-3)}
.field .err{font-size:12px;color:var(--bad);font-weight:600}
.input,select.input,textarea.input{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-height:42px;font-size:16px;font-variant-numeric:tabular-nums}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.input[aria-invalid="true"]{border-color:var(--bad)}
.input-unit{position:relative;display:flex;align-items:center}
.input-unit .input{padding-right:44px}
.input-unit span{position:absolute;right:11px;font-family:var(--f-mono);font-size:12px;color:var(--ink-3);pointer-events:none}
.fgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr))}
.fgrid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.seg{display:inline-flex;background:var(--surface-3);border-radius:11px;padding:3px;gap:3px;flex-wrap:wrap;max-width:100%}
.seg button{appearance:none;border:0;background:none;padding:7px 12px;border-radius:8px;font-weight:600;font-size:13.5px;color:var(--ink-2);cursor:pointer;min-height:36px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg.full{display:flex}
.seg.full button{flex:1}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--ink-2);cursor:pointer}
.check input{width:18px;height:18px;margin-top:1px;accent-color:var(--accent);flex:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600;color:var(--ink-2);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip:hover{border-color:var(--line-strong)}

/* ---------- today ---------- */
.datebar{display:flex;align-items:center;gap:6px}
.datebar .date-label{font-family:var(--f-mono);font-size:13px;font-weight:500;min-width:128px;text-align:center}
.energy{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center}
@media (max-width:520px){.energy{grid-template-columns:1fr;justify-items:center}}
.ring-wrap{position:relative;width:188px;height:188px;flex:none}
.ring-wrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring-big{font-family:var(--f-display);font-weight:800;font-size:50px;line-height:.9;font-variant-numeric:tabular-nums}
.ring-cap{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-top:4px}
.energy-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%}
.estat{background:var(--surface-2);border-radius:11px;padding:10px 12px;min-width:0}
.estat b{display:block;font-family:var(--f-display);font-size:26px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
.estat span{font-size:11.5px;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.macros{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.macro-row{display:grid;grid-template-columns:86px 1fr auto;align-items:center;gap:12px}
.macro-row .mname{font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:7px}
.bar{height:10px;border-radius:99px;background:var(--surface-3);overflow:hidden;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;display:block;max-width:100%}
.bar.over i{background:repeating-linear-gradient(135deg,var(--bad) 0 6px,color-mix(in srgb,var(--bad) 70%,transparent) 6px 12px)!important}
.macro-row .mval{font-family:var(--f-mono);font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.meal{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.meal:first-child{border-top:0;margin-top:0;padding-top:0}
.meal-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.meal-head h3{font-family:var(--f-display);font-weight:800;text-transform:uppercase;font-size:19px;letter-spacing:.03em}
.meal-head .mk{font-family:var(--f-mono);font-size:12.5px;color:var(--ink-3)}
.entry{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.entry:last-child{border-bottom:0}
.entry .en{font-weight:600;font-size:14.5px;overflow-wrap:anywhere}
.entry .em{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-3)}
.entry .ek{font-family:var(--f-mono);font-size:14px;font-weight:600;text-align:right;white-space:nowrap}
.empty{color:var(--ink-3);font-size:13.5px;padding:6px 0}
.water{display:flex;gap:4px;flex-wrap:wrap}
.glass{width:22px;height:30px;border:2px solid var(--line-strong);border-top:0;border-radius:0 0 6px 6px;position:relative;overflow:hidden}
.glass i{position:absolute;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--accent) 65%,transparent)}

/* ---------- food ---------- */
.food-tabs{margin-bottom:14px}
.scan-drop{border:2px dashed var(--line-strong);border-radius:var(--radius);padding:26px 16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--surface-2);cursor:pointer}
.scan-drop.drag{border-color:var(--accent);background:var(--accent-soft)}
.scan-drop svg{width:46px;height:46px;color:var(--accent)}
.scan-preview{max-height:220px;border-radius:10px;border:1px solid var(--line);object-fit:contain;background:var(--surface-2)}
.flist{display:flex;flex-direction:column}
.fitem{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.fitem:hover{background:var(--surface-2)}
.fitem .fn{font-weight:600;overflow-wrap:anywhere}
.fitem .fm{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-3)}
.fitem .fk{font-family:var(--f-mono);font-size:13px;text-align:right;white-space:nowrap}
.macro-strip{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--surface-3)}
.macro-strip i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* ---------- sheet / modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(8,12,12,.5);z-index:120;display:flex;align-items:flex-end;justify-content:center;padding:0}
@media (min-width:700px){.scrim{align-items:center;padding:24px}}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow:auto;border-radius:18px 18px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.25)}
@media (min-width:700px){.sheet{border-radius:18px}}
.sheet-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
.sheet-head .h2{flex:1}
.nutri-preview{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.nutri-preview div{background:var(--surface-2);border-radius:10px;padding:8px;text-align:center}
.nutri-preview b{display:block;font-family:var(--f-display);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.nutri-preview span{font-size:11px;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:130;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
@media (min-width:960px){.toast{bottom:28px}}

/* ---------- plan ---------- */
.target-hero{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.target-hero .big{font-family:var(--f-display);font-weight:900;font-size:clamp(64px,11vw,92px);line-height:.85;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.target-hero .unit{font-family:var(--f-mono);font-size:13px;color:var(--ink-3);padding-bottom:8px;text-transform:uppercase;letter-spacing:.1em}
.calc-chain{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.calc-chain div{background:var(--surface-2);padding:10px 12px}
.calc-chain b{display:block;font-family:var(--f-mono);font-size:17px;font-weight:600}
.calc-chain span{font-size:11.5px;color:var(--ink-3);font-weight:600}
.macro-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:420px){.macro-cards{grid-template-columns:1fr}}
.mcard{border-radius:12px;padding:12px;border:1px solid var(--line);background:var(--surface-2);position:relative;overflow:hidden}
.mcard::before{content:"";position:absolute;left:0;top:0;right:0;height:4px;background:var(--c)}
.mcard .g{font-family:var(--f-display);font-weight:800;font-size:36px;line-height:1;font-variant-numeric:tabular-nums}
.mcard .g small{font-size:18px;margin-left:2px}
.mcard .t{font-weight:700;font-size:13px;margin-top:4px}
.mcard .d{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-3)}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 14px;font-size:14px}
.kv dt{color:var(--ink-2)} .kv dd{margin:0;font-family:var(--f-mono);font-weight:500;text-align:right}
details.method{border-top:1px solid var(--line);padding-top:10px}
details.method summary{cursor:pointer;font-weight:600;font-size:13.5px;color:var(--ink-2)}
details.method ul{margin:8px 0 0;padding-left:18px;font-size:13px;color:var(--ink-2);display:flex;flex-direction:column;gap:5px}

/* ---------- train ---------- */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
@media (max-width:1100px){.week{grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr))}}
.day{border:1px solid var(--line);border-radius:13px;background:var(--surface);padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0;position:relative}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1.5px var(--accent) inset}
.day .dname{font-family:var(--f-display);font-weight:800;text-transform:uppercase;font-size:20px;letter-spacing:.03em;line-height:1}
.day .ddate{font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}
.day .dtitle{font-weight:700;font-size:14px;line-height:1.25}
.type-tag{align-self:flex-start;font-family:var(--f-mono);font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:6px;color:#fff;background:var(--tc)}
.t-weights{--tc:#2C43E0} .t-hiit{--tc:#D6452F} .t-tabata{--tc:#B8338F} .t-walk{--tc:#1B8E4E} .t-rest{--tc:#6D7A76}
:root[data-theme="dark"] .t-weights{--tc:#4F63F0}
.day .dmeta{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-3)}
.day .done-flag{position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:50%;background:var(--good);color:#fff;display:grid;place-items:center}
.day .done-flag svg{width:14px;height:14px}
.muscle-map{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px}
.mm{border-radius:9px;padding:7px 9px;background:var(--surface-2);border:1px solid var(--line);font-size:12.5px;font-weight:600;display:flex;justify-content:space-between;gap:6px}
.mm b{font-family:var(--f-mono);font-weight:600}
.mm.h1x{background:color-mix(in srgb,var(--accent) 12%,var(--surface-2))}
.mm.h2x{background:color-mix(in srgb,var(--accent) 26%,var(--surface-2))}
.mm.h3x{background:color-mix(in srgb,var(--accent) 42%,var(--surface-2))}
.ex-list{display:flex;flex-direction:column}
.ex{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.ex:last-child{border-bottom:0}
.ex .exn{font-weight:600;font-size:14px}
.ex .exm{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-3)}
.ex .exs{font-family:var(--f-mono);font-size:13px;font-weight:600;white-space:nowrap}

/* ---------- timer ---------- */
.timer{border-radius:20px;padding:22px 18px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);position:relative;overflow:hidden;--pc:var(--accent)}
.timer.phase-work{--pc:var(--work)} .timer.phase-rest,.timer.phase-setrest{--pc:var(--rest)} .timer.phase-prep{--pc:var(--prep)} .timer.phase-done{--pc:var(--done)}
.timer::before{content:"";position:absolute;inset:0;background:var(--pc);opacity:.10;transition:background .3s}
.timer>*{position:relative}
.timer-phase{font-family:var(--f-display);font-weight:900;font-size:clamp(30px,6vw,44px);text-transform:uppercase;letter-spacing:.06em;color:var(--pc);line-height:1}
.timer-clock{font-family:var(--f-display);font-weight:900;font-size:clamp(110px,26vw,200px);line-height:.82;font-variant-numeric:tabular-nums;letter-spacing:-.01em;text-align:center;margin:10px 0 6px}
.timer-move{font-size:clamp(18px,3.5vw,24px);font-weight:700;text-align:center;min-height:1.4em}
.timer-next{text-align:center;color:var(--ink-3);font-size:13.5px;min-height:1.4em}
.timer-meta{display:flex;justify-content:space-between;gap:10px;font-family:var(--f-mono);font-size:13px;color:var(--ink-2);flex-wrap:wrap}
.timer-track{display:flex;gap:3px;margin:14px 0 4px}
.timer-track i{flex:1;height:8px;border-radius:3px;background:var(--surface-3)}
.timer-track i.w{background:color-mix(in srgb,var(--work) 30%,var(--surface-3))}
.timer-track i.r{background:color-mix(in srgb,var(--rest) 30%,var(--surface-3));flex:.5}
.timer-track i.past.w{background:var(--work)} .timer-track i.past.r{background:var(--rest)}
.timer-track i.now{outline:2px solid var(--ink);outline-offset:1px}
.timer-controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.timer-controls .btn.go{background:var(--pc);border-color:var(--pc);color:#fff;min-width:150px}

/* ---------- fasting ---------- */
.fast-hero{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center}
@media (max-width:620px){.fast-hero{grid-template-columns:1fr;justify-items:center;text-align:center}}
.clock-wrap{position:relative;width:230px;height:230px}
.clock-wrap svg{width:100%;height:100%}
.clock-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.clock-center b{font-family:var(--f-display);font-weight:900;font-size:46px;line-height:.9;font-variant-numeric:tabular-nums}
.stages{display:flex;flex-direction:column;gap:6px}
.stage{display:grid;grid-template-columns:52px 1fr;gap:10px;font-size:13.5px;padding:7px 10px;border-radius:9px;color:var(--ink-3)}
.stage b{font-family:var(--f-mono);font-weight:600}
.stage.on{background:var(--accent-soft);color:var(--ink)}
.stage.past{color:var(--ink-2)}

/* ---------- progress ---------- */
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--f-mono);font-size:15px;fill:var(--ink-3)}
.chart .grid-line{stroke:var(--line);stroke-width:1}
.chart-tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;font-weight:600;padding:5px 9px;border-radius:7px;white-space:nowrap;z-index:5}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:7px 8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.tbl td.r,.tbl th.r{text-align:right}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px}
.kpi{background:var(--surface-2);border-radius:12px;padding:12px}
.kpi b{display:block;font-family:var(--f-display);font-size:30px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--ink-3);font-weight:600}

.setup-banner{background:var(--ink);color:var(--bg);border-radius:var(--radius);padding:16px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.setup-banner .h2{color:var(--bg)}
.setup-banner p{color:color-mix(in srgb,var(--bg) 78%,var(--ink));font-size:14px}
.setup-banner .btn.primary{margin-left:auto}
.store-banner{grid-column:1/-1;background:var(--warn-soft);color:var(--ink);padding:10px 16px;display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;font-size:14px;font-weight:600;text-align:center}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--line-strong);border-top-color:var(--accent);animation:spin .8s linear infinite;display:inline-block;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

:root{--accent:#167A49;--accent-hover:#11633B;--accent-soft:#DCF1E5;--accent-ink:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--accent:#3FCB82;--accent-hover:#62D99A;--accent-soft:#12301F;--accent-ink:#0C1113}}
:root[data-theme="dark"]{--accent:#3FCB82;--accent-hover:#62D99A;--accent-soft:#12301F;--accent-ink:#0C1113}
.hero{display:flex;flex-direction:column;gap:12px;align-items:flex-start;padding:22px}
.coach-card{background:var(--ink);color:var(--bg);border-radius:var(--radius);padding:18px 20px;position:relative;overflow:hidden}
.coach-card::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:var(--accent);opacity:.35}
.coach-q{font-family:var(--f-display);font-weight:800;font-size:clamp(22px,5vw,30px);line-height:1.12;text-transform:none;position:relative;max-width:40ch}
.coach-by{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.75;margin-top:8px;position:relative}
.ex-mini{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column}
.ex-mini li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
.ex-mini li:last-child{border-bottom:0}
.week-dots{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px}
.wd{aspect-ratio:1;max-width:100%;border-radius:50%;display:grid;place-items:center;background:var(--surface-3);font-weight:700;font-size:12px;color:var(--ink-3)}
.wd.plan{background:var(--accent-soft);color:var(--accent)}
.wd.done{background:var(--accent);color:var(--accent-ink)}
.wd.now{outline:2px solid var(--ink);outline-offset:2px}
.why{font-size:16px;line-height:1.5}
.saved-row{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.saved-row:last-child{border-bottom:0}
.danger-arm{color:var(--bad);border-color:var(--bad)}
.fn{font-weight:600}
.plan-week{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr))}
.pday{appearance:none;text-align:left;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:5px;color:inherit;box-shadow:var(--shadow);min-width:0}
.pday.today{border-color:var(--accent);box-shadow:0 0 0 1.5px var(--accent) inset}
.pday.rest{background:var(--surface-2);box-shadow:none;cursor:default}
.pday .dname{font-family:var(--f-display);font-weight:800;text-transform:uppercase;font-size:20px;letter-spacing:.03em}
.pday .dtitle{font-weight:700;font-size:15px}
.pblock{background:var(--surface-2);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.pgroup{border:1px solid var(--line);border-radius:12px;padding:6px 10px}
.pex{appearance:none;background:none;border:0;border-bottom:1px dashed var(--line);width:100%;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 0;text-align:left;cursor:pointer;color:inherit}
.pgroup .pex:last-child{border-bottom:0}
.pex-tag{font-family:var(--f-mono);font-weight:600;font-size:12px;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:3px 7px;min-width:30px;text-align:center}
.pex-tag.big{font-size:15px;padding:5px 10px}
.lib{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,160px),1fr))}
.lib-item{appearance:none;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0;overflow:hidden;cursor:pointer;color:inherit;text-align:left;display:flex;flex-direction:column;min-width:0}
.lib-cv{width:100%;aspect-ratio:4/3;display:block;background:var(--surface-2)}
.lib-txt{padding:9px 10px 11px;display:flex;flex-direction:column;gap:2px}
.demo-cv{width:100%;max-width:520px;aspect-ratio:4/3;display:block;margin:0 auto;background:var(--surface-2);border-radius:14px}
.demo-cv.small{max-width:300px}
.stills{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stills figure{margin:0;display:flex;flex-direction:column;gap:4px;align-items:center}
.still-cv{width:100%;aspect-ratio:4/3;background:var(--surface-2);border-radius:10px}
.stills figcaption{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3)}
.cues{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px;font-size:14.5px}
.cues.avoid li::marker{color:var(--bad)}
.logrow{border-bottom:1px solid var(--line);padding:8px 0}
.logrow summary{cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center;list-style:none}
.logrow summary::-webkit-details-marker{display:none}
.logrow ul{margin:8px 0 0;padding-left:18px;color:var(--ink-2)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.badge{display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--surface-2);color:var(--ink-3);font-size:13px;font-weight:600}
.badge svg{width:18px;height:18px;flex:none}
.badge.got{background:var(--accent-soft);color:var(--accent)}

/* player */
.player{position:fixed;inset:0;z-index:90;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
.pl-top{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 8px}
.pl-x{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 12px 7px 9px;display:flex;gap:5px;align-items:center;font-weight:700;font-size:13px;cursor:pointer}
.pl-x svg{width:16px;height:16px}
.pl-title{font-weight:700;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl-prog{height:5px;background:var(--surface-3);margin:0 16px}
.pl-prog i{display:block;height:100%;background:var(--accent);border-radius:99px}
.pl-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;max-width:640px;width:100%;margin:0 auto;-webkit-overflow-scrolling:touch}
.pl-body.center{align-items:center;text-align:center}
.pl-name{font-size:clamp(30px,8vw,44px)}
.pl-target{font-family:var(--f-display);font-weight:900;font-size:clamp(40px,12vw,64px);line-height:.95;color:var(--accent)}
.pl-prompt{font-size:17px;font-weight:600;color:var(--ink-2)}
.pl-nav{display:grid;grid-template-columns:auto 1fr auto;gap:8px;padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 12px);border-top:1px solid var(--line);background:var(--surface);max-width:100%}
.pl-nav .btn.lg{min-height:54px}
.rest-clock{font-family:var(--f-display);font-weight:900;font-size:clamp(84px,26vw,150px);line-height:.9;font-variant-numeric:tabular-nums}
.hold{display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--surface-2);border-radius:14px;padding:14px}
.hold-clock{font-family:var(--f-display);font-weight:900;font-size:80px;line-height:.9}
.iv-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center}
.iv-label{font-size:20px;font-weight:700}
.iv-speed{display:flex;gap:22px}
.iv-speed div{display:flex;flex-direction:column}
.iv-speed b{font-size:34px;font-weight:600}
.iv-speed span{font-size:12px;color:var(--ink-3)}
.tech summary{cursor:pointer;font-weight:700}
.done-badge{width:84px;height:84px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.done-badge svg{width:42px;height:42px}
.stepper{display:grid;grid-template-columns:48px 1fr 48px;gap:6px;align-items:center}
.step{appearance:none;height:48px;border-radius:12px;border:1px solid var(--line-strong);background:var(--surface);font-size:24px;font-weight:700;cursor:pointer;color:var(--ink)}

/* v2 */
.sheet-back{margin:-6px 0 6px -8px}
.wz-dots{display:flex;gap:6px;margin:-4px 0 14px}
.wz-dots span{flex:1;height:6px;border-radius:99px;background:var(--surface-3);font-size:0}
.wz-dots span.done{background:var(--accent)}.wz-dots span.now{background:var(--accent);opacity:.55}
.wz-nav{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;margin-top:6px}
.wz-nav .btn.lg{justify-self:end}
.parq{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}
@media (max-width:420px){.parq{grid-template-columns:1fr}}
.review{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.review div{background:var(--surface-2);border-radius:10px;padding:9px 11px;display:flex;flex-direction:column;gap:2px}
.review span{font-size:11.5px;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.sched{display:flex;flex-direction:column}
.sched-row{display:grid;grid-template-columns:56px 1fr 42px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}

.sched-row select{min-width:0}
.linkish{appearance:none;background:none;border:0;padding:0;text-align:left;cursor:pointer;color:inherit;font:inherit;min-width:0}
button.linkish{color:var(--accent);font-weight:600}
.saved-row .linkish{color:inherit;font-weight:inherit}
.saved-row{grid-template-columns:1fr auto auto auto}
.plan-notes{margin:0;padding-left:18px;color:var(--ink-2);display:flex;flex-direction:column;gap:6px}
.cal-card{padding:12px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-h{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);text-align:center;padding:4px 0}
.cal-d{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;min-height:68px;padding:5px;display:flex;flex-direction:column;gap:3px;align-items:flex-start;text-align:left;cursor:pointer;color:inherit;min-width:0;overflow:hidden}
.cal-d.out{opacity:.4}
.cal-d.today{border-color:var(--ink);box-shadow:0 0 0 1.5px var(--ink) inset}
.cal-d.plan{background:var(--accent-soft)}
.cal-d.done{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.cal-n{font-weight:700;font-size:13px;display:flex;gap:4px;align-items:center}
.cal-t{font-size:10.5px;line-height:1.15;font-weight:600;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;word-break:break-word}
.cal-dl{font-family:var(--f-mono);font-size:9px;text-transform:uppercase;opacity:.7}
.cal-over{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--warn)}
@media (max-width:420px){.cal-d{min-height:58px;padding:4px}.cal-t{font-size:9.5px;-webkit-line-clamp:2}}
.big-num{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1}
.tbar{height:12px;border-radius:99px;background:var(--surface-3);overflow:hidden;margin:10px 0 8px}
.tbar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.zones{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:6px;margin-top:10px}
.zone{border-radius:9px;padding:6px 8px;display:flex;flex-direction:column;font-size:12px;border-left:5px solid var(--zc);background:var(--surface-2)}
.zone b{font-size:12px}
.z1{--zc:#8FA3B0}.z2{--zc:#2E9E6A}.z3{--zc:#D9A400}.z4{--zc:#E2742B}.z5{--zc:#D6332F}
.zbar{display:flex;height:10px;border-radius:99px;overflow:hidden;margin-top:8px;gap:2px}
.zbar.big{height:16px}
.zbar i{display:block;background:var(--zc)}
.rpe{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}
.rpe button{appearance:none;border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;min-height:40px;font-weight:700;cursor:pointer;color:var(--ink)}
.rpe button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.watch-guide ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:7px;font-size:14px}

.tr-big{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.pb-row .icon-btn.sm{width:32px;height:32px}

/* Live player: attach to a canvas, loops until stopped. */
const AnimPlayer = {
  list: new Set(),
  attach(cv, animId, opts = {}) {
    const anim = ANIMS[animId]; if (!anim || !cv) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    const w = cv.clientWidth || 320, h = cv.clientHeight || 280;
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    if (opts.still != null) { drawFrame(cv, anim, opts.still); return; }
    const item = { cv, anim, t0: performance.now() };
    this.list.add(item); this.loop();
  },
  clear() { this.list.clear(); },
  loop() {
    if (this.raf) return;
    const step = now => {
      this.raf = 0;
      let alive = 0;
      for (const it of this.list) {
        if (!it.cv.isConnected) { this.list.delete(it); continue; }
        alive++;
        const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
        const f = reduce ? 0.5 / it.anim.keys.length : (((now - it.t0) / 1000) / it.anim.dur) % 1;
        drawFrame(it.cv, it.anim, f);
      }
      if (alive) this.raf = requestAnimationFrame(step);
    };
    this.raf = requestAnimationFrame(step);
  },
};

/* ============================================================
   CAS Treadmill / CAS Trainer — phone control of speed and
   incline over the FTMS Control Point (0x2AD9).
   Safety rules built in:
   • off until the user turns it on and accepts the safety notes
   • the phone never starts the belt (no Start command is ever sent);
     speed changes only while the belt is already moving
   • a top-speed limit set by the user
   • small steps per tap; automatic changes are announced 5 s ahead
   • a STOP BELT button is always on screen while controlling
   ============================================================ */
const FTU = n => `0000${n}-0000-1000-8000-00805f9b34fb`;
const CP_UUID = FTU("2ad9"), FEAT_UUID = FTU("2acc"), SR_UUID = FTU("2ad4"), IR_UUID = FTU("2ad5"), STAT_UUID = FTU("2ada");
const CP_RESULT = { 1: "done", 2: "not supported by this treadmill", 3: "value out of range", 4: "the treadmill refused (operation failed)", 5: "control not permitted (another app may be in control, or the console needs to be on its home screen)" };
TM.ctl = null;
function ctlCfg() { const c = tcfg(); return { on: !!c.ctl, maxKmh: Number(c.maxKmh) || 8, auto: c.autoFollow !== false }; }
const ctlReady = () => TM.ctl && (TM.state === "on" || TM.state === "demo");
const ctlActive = () => ctlReady() && ctlCfg().on && TM.ctl.cp !== false;

async function ctlSetup(svc) {
  const c = { can: { speed: null, incline: null }, sr: [0.8, 20, 0.1], ir: [0, 15, 0.5], cp: null, granted: false, msg: "", pending: null, queue: Promise.resolve() };
  TM.ctl = c;
  const read = async uuid => { try { const ch = await svc.getCharacteristic(uuid); return await ch.readValue(); } catch (e) { return null; } };
  const f = await read(FEAT_UUID);
  if (f && f.byteLength >= 8) { const t = f.getUint32(4, true); c.can.speed = !!(t & 1); c.can.incline = !!(t & 2); }
  const sr = await read(SR_UUID); if (sr && sr.byteLength >= 6) c.sr = [sr.getUint16(0, true) / 100, sr.getUint16(2, true) / 100, sr.getUint16(4, true) / 100 || 0.1];
  const ir = await read(IR_UUID); if (ir && ir.byteLength >= 6) c.ir = [ir.getInt16(0, true) / 10, ir.getInt16(2, true) / 10, ir.getUint16(4, true) / 10 || 0.5];
  try {
    const cp = await svc.getCharacteristic(CP_UUID);
    cp.addEventListener("characteristicvaluechanged", e => { const v = e.target.value; if (v && v.byteLength >= 3 && v.getUint8(0) === 0x80 && c.pending && c.pending.op === v.getUint8(1)) { const p = c.pending; c.pending = null; clearTimeout(p.to); p.res(v.getUint8(2)); } });
    await cp.startNotifications(); c.cp = cp;
  } catch (e) { c.cp = false; }
  try { const st = await svc.getCharacteristic(STAT_UUID); st.addEventListener("characteristicvaluechanged", e => { const v = e.target.value; if (v && v.byteLength && v.getUint8(0) === 0x02) { c.granted = false; ctlNote("The treadmill stopped (safety key or console Stop)."); } if (v && v.byteLength && v.getUint8(0) === 0xff) { c.granted = false; } }); await st.startNotifications(); } catch (e) {}
}
function ctlDemoSetup() { TM.ctl = { can: { speed: true, incline: true }, sr: [0.8, 20, 0.1], ir: [0, 15, 0.5], cp: "demo", granted: true, msg: "", demo: true, queue: Promise.resolve() }; }
function ctlNote(msg) { if (TM.ctl) TM.ctl.msg = msg; if (RS.on) runHUD(); else if (APP.tab === "tread" && !SHEETS.length) render(); }
function ctlSend(bytes) {
  const c = TM.ctl; if (!c) return Promise.resolve(0);
  if (c.demo) return Promise.resolve(ctlDemoApply(bytes));
  const run = () => new Promise(async res => {
    const to = setTimeout(() => { c.pending = null; res(-1); }, 3500);
    c.pending = { op: bytes[0], res, to };
    try { const buf = new Uint8Array(bytes); if (c.cp.writeValueWithResponse) await c.cp.writeValueWithResponse(buf); else await c.cp.writeValue(buf); }
    catch (e) { clearTimeout(to); c.pending = null; res(-2); }
  });
  c.queue = c.queue.then(run, run); return c.queue;
}
function ctlDemoApply(b) { const d = TM.demo; if (!d) return 4; if (b[0] === 0x02) d.tSpeed = (b[1] | b[2] << 8) / 100; if (b[0] === 0x03) d.tIncline = ((b[1] | b[2] << 8) << 16 >> 16) / 10; if (b[0] === 0x08) { d.tSpeed = 0; } return 1; }
function ctlEnsure() { const c = TM.ctl; if (!c || c.cp === false) return Promise.resolve(false); if (c.granted) return Promise.resolve(true); if (!c.asking) c.asking = ctlEnsure0().finally(() => { c.asking = null; }); return c.asking; }
async function ctlEnsure0() {
  const c = TM.ctl;
  const r = await ctlSend([0x00]); if (r === 1) { c.granted = true; return true; }
  ctlNote(r === -1 ? "The treadmill didn't answer the control request." : r === -2 ? "Couldn't send the command over Bluetooth." : `Control request: ${CP_RESULT[r] || "error " + r}.`); return false;
}
const beltMoving = () => (TM.data && TM.data.speed || 0) >= 0.3;
async function ctlSpeed(kmh, quiet) {
  const c = TM.ctl, cfg = ctlCfg(); if (!ctlActive()) return false;
  if (!beltMoving()) { ctlNote("Start the belt on the console first. For safety the phone never starts the belt."); return false; }
  const max = Math.min(c.sr[1], cfg.maxKmh); kmh = Math.round(clamp(kmh, Math.max(0.8, c.sr[0]), max) * 10) / 10;

}
async function ctlIncline(p, quiet) {
  const c = TM.ctl; if (!ctlActive()) return false;
  p = Math.round(clamp(p, Math.max(0, c.ir[0]), Math.min(15, c.ir[1])) * 2) / 2;
  if (!(await ctlEnsure())) return false;

}
async function ctlStop() {
  if (!TM.ctl) return; if (RS.on) RS.ctlPend = null;
  const ok = await ctlEnsure(); const r = ok ? await ctlSend([0x08, 0x01]) : 0;
  playSound("buzzer"); ctlNote(r === 1 ? "Stop sent. The belt is slowing to a stop." : "The treadmill didn't accept Stop. Use the red STOP button or pull the safety key.");

/* ---------- automatic following of route / workout targets ---------- */
function ctlPlan(tg) {
  if (!RS.on || !tg || !ctlActive() || !ctlCfg().auto) return;
  const want = { g: Number.isFinite(tg.g) ? tg.g : null, v: tg.v ? Math.min(tg.v, ctlCfg().maxKmh) : null, seg: RS.seg };
  const curV = TM.data.speed || 0, curG = TM.data.incline || 0;
  const needV = want.v != null && Math.abs(want.v - curV) > 0.15, needG = want.g != null && Math.abs(want.g - curG) > 0.4;
  if (!needV && !needG) return;
  RS.ctlPend = Object.assign(want, { at: Date.now() + 5000, needV, needG });
  const parts = []; if (needV) parts.push(`speed ${want.v > curV ? "up" : "down"} to ${fmt(spD(want.v), 1)}`); if (needG) parts.push(`incline ${want.g > curG ? "up" : "down"} to ${fmt(want.g, 0)} percent`);
  runPrompt(`In 5 seconds: ${parts.join(" and ")}.`, true);
}
function ctlTick() {
  if (!RS.on || !ctlActive() || !ctlCfg().auto) return;
  const p = RS.ctlPend;
  if (!p && RS.target && beltMoving() && RS.ctlSeg !== RS.seg) { RS.ctlSeg = RS.seg; ctlPlan(RS.target); return; }
  if (p && Date.now() >= p.at) { RS.ctlPend = null; if (!beltMoving()) return; if (p.needG) ctlIncline(p.g, true); if (p.needV) ctlSpeed(p.v, true); }
}
setInterval(ctlTick, 500);

  const step = [1, 2, 2.5, 5, 10].map(x => x * mag).find(x => x >= raw) || raw;
  const start = Math.floor(lo / step) * step, out = [];
  for (let i = 0; i < 20; i++) { const v = start + i * step; out.push(Math.round(v * 1000) / 1000); if (v >= hi - step * 0.001) break; }
  return { ticks: out, lo: start, hi: out[out.length - 1] };
}
function barChart(bars, opts = {}) {
  if (!bars.some(b => b.v > 0)) return `<p class="empty">${opts.empty || "No data yet."}</p>`;
  const W = 640, H = 210, L = 50, R = 12, T = 14, B = 30, n = bars.length, bw = (W - L - R) / n;
  const nt = niceTicks(0, Math.max(...bars.map(b => b.v)) * 1.1 || 1, 4), y = v => T + (1 - v / nt.hi) * (H - T - B);
  return `<div class="chart-host" style="position:relative"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label || "Chart")}">
    ${nt.ticks.map(t => `<line class="grid-line" x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/><text x="${L - 8}" y="${y(t) + 4}" text-anchor="end">${fmt(t)}</text>`).join("")}
    ${bars.map((b, i) => { const x0 = L + i * bw + 4, w = bw - 8, hgt = Math.max(0, y(0) - y(b.v)); return `${b.v > 0 ? `<path d="M${x0},${y(0)} v${-Math.max(hgt - 4, 0)} q0,-4 4,-4 h${Math.max(w - 8, 0)} q4,0 4,4 v${Math.max(hgt - 4, 0)} z" fill="var(--accent)" opacity="${i === n - 1 ? 1 : 0.75}"/>` : ""}<text x="${x0 + w / 2}" y="${H - 9}" text-anchor="middle">${esc(b.label)}</text><rect x="${L + i * bw}" y="${T}" width="${bw}" height="${H - T - B}" fill="transparent" data-tip="${esc(b.tip)}"/>`; }).join("")}
  </svg><div class="chart-tip" hidden></div></div>`;
}
function sendHref(id) { const code = treadPayload(id); return code ? "x-safari-https://" + TRAINER_URL.replace(/^https:\/\//, "") + "?tread=" + code : "#"; }
function treadSummaryExtra(x) {
  return `<div class="note ${x.sent ? "good" : ""}" style="margin-top:10px">${x.sent ? "Sent to CAS Trainer. You can send it again if it didn't arrive." : "<b>Not in CAS Trainer yet.</b> Send it so it counts towards your log and streak."}</div>
    <div class="row" style="margin-top:8px;gap:8px;flex-wrap:wrap"><a class="btn primary" href="${sendHref(x.id)}" data-action="tr-sent" data-id="${x.id}">Send to CAS Trainer (opens Safari)</a><button class="btn" type="button" data-action="tr-copycode" data-id="${x.id}">Copy code</button></div>
    <p class="small muted" style="margin-top:4px">If Safari doesn't open, tap Copy code, open CAS Trainer in Safari, go to Treadmill → Import and paste.</p>`;
}
ACTIONS["tr-sent"] = el => { const h = historyList(), x = h.find(r => r.id === el.dataset.id); if (x) { x.sent = Date.now(); Store.set("history", h); } };
ACTIONS["tr-copycode"] = async el => { const code = "CAST1." + treadPayload(el.dataset.id); try { await navigator.clipboard.writeText(code); toast("Code copied. Paste it in CAS Trainer → Treadmill → Import"); } catch (e) { openSheet(`${sheetHead("Copy this code")}<textarea class="input" rows="6" readonly style="font-family:var(--f-mono);font-size:11px">${esc(code)}</textarea>`); } ACTIONS["tr-sent"](el); };
function treadViewExtra() {
  const unsent = historyList().filter(x => x.tread && !x.sent);
  return `<p class="small muted" style="margin:-6px 0 12px">Works without signing in. Sessions are kept on this phone until you send them to <a href="${TRAINER_URL}">CAS Trainer</a>.</p>
    ${unsent.length ? `<div class="note warn" style="margin-bottom:12px"><b>${unsent.length} session${unsent.length > 1 ? "s" : ""} not sent to CAS Trainer yet.</b> Open ${unsent.length > 1 ? "each one" : "it"} under Recent sessions and tap Send.</div>` : ""}
    <section class="card" style="margin-bottom:16px"><div class="row between" style="gap:10px;flex-wrap:wrap"><div><b>Your weight</b><div class="small muted">Used to estimate calories</div></div><div class="input-unit" style="max-width:130px"><input class="input" type="number" inputmode="decimal" value="${latestKg()}" data-change="cw-kg" aria-label="Your weight in kg"><span>kg</span></div></div></section>`;
}
CHANGES["cw-kg"] = el => { const v = num(el.value); if (v > 25 && v < 300) { Store.set("kg", v); toast("Weight saved"); } };
APP.tabs = [["tread", "Treadmill", "run"]];
APP.tab = "tread";
(async function boot() {
  await Store.init();
  render();
})();

</script>
